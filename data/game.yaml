design_hypotheses:
- Två handlingar per karaktär ger lagom tempo.
- Personliga ryggsäckar skapar positionering och naturligt samarbete.
- Fyra platser är normal ryggsäckskapacitet.
- Målobjekt som tar två platser skapar en logistisk hemresa.
- Verktyg är den enda generella resursen.
- Utrustningskort är mer begripliga och tematiska än flera resursmarkörer.
- En synlig uthållighetspool skapar tydlig tidspress och enkel svårighetsskalning.
