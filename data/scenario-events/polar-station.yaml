    - route
    - immediate
    - positive
  - id: polar_east_cargo_tunnel
    name: Östra lasttunneln
    symbol: ↔
    severity: mild
    effect_type: map_change
    text: Ta bort eventuell markör på V2 och lägg en Öppen väg-markör där. Lasttunneln
      mellan Plats 5 och Förrådet är nu öppen.
    effects:
    - action: open_connection
      connection_id: route_v2
    tags:
    - route
    - immediate
    - positive
  format_version: 1
  scope:
