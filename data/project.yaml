  manifest_path: output/build-manifest.json
  report_path: output/build-report.md
  log_path: output/build-log.txt
  fail_on_warning: false
  clean_generated_before_build: true
  clean_paths:
  - output/components/cards
  - output/components/boards
  - output/components/reference
  - output/components/tokens
  - output/print/svg
  - output/print/pdf
  - output/preview/build-verification
  - output/print-package
