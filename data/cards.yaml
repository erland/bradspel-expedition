  name: Äldre pipelineprov
  purpose: Tekniska referenskort; används inte i v1.0-printpaketet.
cards:
- id: explore_abandoned_station
  name: Övergiven station
  type: exploration
  deck: prototype
  count: 1
  icon: search
  rules:
    timing: on_reveal
    effects:
    - action: gain_resource
      resource: tools
      amount: 1
    - action: lose_endurance
      amount: 1
  display:
    category: UTFORSKNING
    title: Övergiven station
    body: Få 1 verktyg. Förlora sedan 1 uthållighet.
