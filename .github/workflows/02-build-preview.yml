name: Build Print Preview

on:
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "templates/**"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate before build
        run: python scripts/ci_validate.py --root .

      - name: Build all printable output
        run: python scripts/build_all.py --root . --clean --strict

      - name: Verify built print package
        run: python scripts/ci_validate.py --root . --built --skip-tests

      - name: Upload print preview
        uses: actions/upload-artifact@v7
        with:
          name: expedition-print-preview-${{ github.run_number }}
          path: |
            output/print/pdf/*.pdf
            output/print-package/*
            output/build-manifest.json
            output/build-report.md
          if-no-files-found: error
          retention-days: 14
