name: Release Print Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate tagged project
        run: python scripts/ci_validate.py --root .

      - name: Require tag to match project version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("data/project.yaml").read_text(encoding="utf-8"))
          print(data["project"]["project_version"])
          PY
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} matchar inte projektversion v${project_version}." >&2
            exit 1
          fi

      - name: Build all printable output
        run: python scripts/build_all.py --root . --clean --strict

      - name: Verify built print package
        run: python scripts/ci_validate.py --root . --built --skip-tests

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/expedition-release"
          python scripts/package_release.py             --root .             --output-dir "${RUNNER_TEMP}/expedition-release"             --expected-version "${GITHUB_REF_NAME#v}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: expedition-${{ github.ref_name }}-print-release
          path: ${{ runner.temp }}/expedition-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${RUNNER_TEMP}"/expedition-release/* --clobber
          else
            gh release create "${tag}" "${RUNNER_TEMP}"/expedition-release/*               --title "${tag}"               --generate-notes
          fi
