       font-family="DejaVu Sans" font-size="3" fill="#202020">lägga tillbaka den dold.</text>
 <text x="31.5" y="84.5" text-anchor="middle"
       font-family="DejaVu Sans" font-size="2" fill="#666">Karaktärsförmåga</text>
