 <text x="5" y="52.2" font-family="DejaVu Sans"
       font-size="2.9" font-weight="700" fill="#202020">Ryggsäck: 4 platser</text>
 <text x="31.5" y="61.0" text-anchor="middle"
       font-family="DejaVu Sans" font-size="3" fill="#202020">En gång per runda får du titta på en</text>
 <text x="31.5" y="65.1" text-anchor="middle"
