 <rect x="0.25" y="8" width="62.5" height="3" fill="#56785b"/>
 <text x="31.5" y="7.2" text-anchor="middle"
       font-family="DejaVu Sans" font-size="3" font-weight="700" fill="#fff">KARAKTÄR</text>
 <text x="31.5" y="18" text-anchor="middle"
       font-family="DejaVu Sans" font-size="5" font-weight="700" fill="#202020">Spejaren</text>
 <circle cx="31.5" cy="34" r="8" fill="#56785b" opacity="0.18"/>
 <text x="31.5" y="37" text-anchor="middle"
       font-family="DejaVu Sans" font-size="9" font-weight="700" fill="#56785b">S</text>
 <text x="5" y="48.0" font-family="DejaVu Sans"
